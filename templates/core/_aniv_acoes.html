{# Selos de "já enviado" + botão de envio manual de UMA pessoa.
   Usado nas duas listas (a de hoje e a do mês). #}
<span class="aniv-acoes">
    {% if p.enviado_whatsapp %}<span class="aniv-selo aniv-selo-ok" title="Enviado por WhatsApp este ano">💬 ✓</span>{% endif %}
    {% if p.enviado_email %}<span class="aniv-selo aniv-selo-ok" title="Enviado por e-mail este ano">✉️ ✓</span>{% endif %}
    <button type="button" class="aniv-enviar btn-secundario"
            data-chave="{{ p.chave }}"
            data-nome="{{ p.nome }}"
            {% if p.enviado_whatsapp and p.enviado_email %}data-reenvio="1"{% endif %}>
        {% if p.enviado_whatsapp and p.enviado_email %}↻ Reenviar{% else %}📤 Enviar{% endif %}
    </button>
</span>
